<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cloud Task Manager - MSSV 2324802010354</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #f4f6f9; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { padding: 8px 14px; cursor: pointer; background: #0d6efd; color: #fff; border: none; border-radius: 4px; margin-top: 6px; }
    button.danger { background: #dc3545; }
    button.warn { background: #ffc107; color: #000; }
    .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
  </style>
</head>
<body>
  <h2>Quản lý Công việc Đám mây (VPS: vps-2324802010354)</h2>
  <div id="auth-box" class="card">
    <h3>Đăng nhập / Đăng ký</h3>
    <input id="username" placeholder="Tên đăng nhập">
    <input id="password" type="password" placeholder="Mật khẩu">
    <button onclick="auth('login')">Đăng nhập</button>
    <button onclick="auth('register')" style="background:#198754">Đăng ký mới</button>
    <p id="auth-msg" style="color:red"></p>
  </div>
  <div id="app-box" class="card" style="display:none">
    <div style="display:flex; justify-content:space-between;">
      <span>Xin chào, <b id="user-display"></b></span>
      <button class="danger" onclick="logout()">Đăng xuất</button>
    </div>
    <hr>
    <h3>Thêm công việc mới</h3>
    <input id="task-title" placeholder="Tiêu đề công việc">
    <input id="task-desc" placeholder="Mô tả chi tiết">
    <button onclick="addTask()">Thêm mới</button>
    <h3>Danh sách công việc</h3>
    <div id="task-list"></div>
  </div>
<script>
  let token = localStorage.getItem("token");
  let currentUser = localStorage.getItem("username");
  if (token) showApp();
  async function auth(type) {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const res = await fetch(`/api/${type}`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password}) });
    const data = await res.json();
    if (!res.ok) { document.getElementById("auth-msg").innerText = data.detail; return; }
    if (type === "register") { alert("Đăng ký thành công! Hãy bấm Đăng nhập."); return; }
    token = data.token; currentUser = data.username;
    localStorage.setItem("token", token); localStorage.setItem("username", currentUser);
    showApp();
  }
  function showApp() {
    document.getElementById("auth-box").style.display = "none";
    document.getElementById("app-box").style.display = "block";
    document.getElementById("user-display").innerText = currentUser;
    loadTasks();
  }
  function logout() { localStorage.clear(); location.reload(); }
  async function loadTasks() {
    const res = await fetch("/api/tasks", { headers: {"Authorization": `Bearer ${token}`} });
    const tasks = await res.json();
    document.getElementById("task-list").innerHTML = tasks.map(t => `<div class="item"><div><b>${t.title}</b><br><small>${t.description}</small></div><div><button class="warn" onclick="editTask(${t.id}, '${t.title}', '${t.description}')">Sửa</button> <button class="danger" onclick="delTask(${t.id})">Xóa</button></div></div>`).join("");
  }
  async function addTask() {
    const title = document.getElementById("task-title").value;
    const description = document.getElementById("task-desc").value;
    if (!title) return;
    await fetch("/api/tasks", { method: "POST", headers: {"Content-Type": "application/json", "Authorization": `Bearer ${token}`}, body: JSON.stringify({title, description}) });
    document.getElementById("task-title").value = ""; document.getElementById("task-desc").value = "";
    loadTasks();
  }
  async function editTask(id, oldTitle, oldDesc) {
    const title = prompt("Tiêu đề mới:", oldTitle);
    const description = prompt("Mô tả mới:", oldDesc);
    if (!title) return;
    await fetch(`/api/tasks/${id}`, { method: "PUT", headers: {"Content-Type": "application/json", "Authorization": `Bearer ${token}`}, body: JSON.stringify({title, description}) });
    loadTasks();
  }
  async function delTask(id) {
    await fetch(`/api/tasks/${id}`, { method: "DELETE", headers: {"Authorization": `Bearer ${token}`} });
    loadTasks();
  }
</script>
</body>
</html>
